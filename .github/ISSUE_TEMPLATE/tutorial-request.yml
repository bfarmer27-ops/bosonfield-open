name: Tutorial request
description: Ask for one beginner AI-video lesson.
title: "Tutorial: "
labels:
  - tutorial-request
body:
  - type: textarea
    id: goal
    attributes:
      label: What do you want to make?
      description: Name the result, length, and output format.
      placeholder: A five-second image-to-video clip in MP4 format.
    validations:
      required: true
  - type: dropdown
    id: system
    attributes:
      label: Computer system
      options:
        - Windows
        - macOS
        - Linux
        - Cloud or hosted notebook
        - I do not know
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: GPU model and memory
      description: Write the graphics-card name and VRAM. VRAM is the memory on the graphics card.
      placeholder: NVIDIA RTX 3060, 12 GB VRAM
  - type: textarea
    id: blocker
    attributes:
      label: What blocks you now?
      description: Paste the exact error or name the step you cannot finish. Remove private paths and keys.
    validations:
      required: true
  - type: checkboxes
    id: public
    attributes:
      label: Public report check
      options:
        - label: I removed passwords, tokens, cookies, private media, and personal data.
          required: true
